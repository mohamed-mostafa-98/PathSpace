name: Windows CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-package:
    name: Quality and Windows packages
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET projects
        shell: pwsh
        run: dotnet restore .\PathSpace.sln

      - name: Test .NET contracts, worker, and application
        shell: pwsh
        run: dotnet test .\PathSpace.sln -c Release --no-restore --logger 'trx;LogFilePrefix=PathSpace' --results-directory .\artifacts\test-results

      - name: Test PowerShell engine
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -EQ '4.10.1')) {
            Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          $result = Invoke-Pester -Script @('.\tests\engine','.\tests\signing') -OutputFormat NUnitXml -OutputFile '.\artifacts\test-results\PathSpace-powershell.xml' -PassThru
          if ($result.FailedCount -ne 0) { exit 1 }

      - name: Validate Markdown links
        shell: pwsh
        run: .\scripts\test-markdown-links.ps1

      - name: Build portable package
        shell: powershell
        run: .\scripts\build-portable.ps1

      - name: Verify portable checksums
        shell: pwsh
        run: .\scripts\test-package-checksums.ps1

      - name: Validate offline host evidence collector
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'pathspace-host-evidence-fixture'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture 'sample.txt') -Value 'fixture' -NoNewline
          .\artifacts\PathSpace-win-x64\validation\collect-windows-host-evidence.ps1 -ProductRoot .\artifacts\PathSpace-win-x64 -ScanPath $fixture -ReportPath .\artifacts\test-results\PathSpace-host-evidence.json -SkipAppLaunch
          $report = Get-Content .\artifacts\test-results\PathSpace-host-evidence.json -Raw | ConvertFrom-Json
          if ($report.kind -ne 'host.validation' -or -not $report.scan.complete -or $report.scan.fileCount -ne 1 -or $report.collectorNetworkAccess) { throw 'Host evidence report validation failed.' }

      - name: Smoke-test packaged worker
        shell: pwsh
        run: .\scripts\verify-portable-action.ps1

      - name: Build self-contained MSI
        shell: powershell
        run: .\scripts\build-installer.ps1

      - name: Verify MSI structure and administrative extraction
        shell: powershell
        run: .\scripts\test-installer.ps1

      - name: Verify MSI checksum
        shell: pwsh
        run: .\scripts\test-package-checksums.ps1 -ArtifactPath .\artifacts\installer

      - name: Verify disposable full signed release
        shell: powershell
        run: .\scripts\test-disposable-signed-release.ps1

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathspace-test-results-${{ github.run_number }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload portable package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PathSpace-win-x64-${{ github.run_number }}
          path: artifacts/PathSpace-win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned MSI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PathSpace-installer-win-x64-${{ github.run_number }}
          path: artifacts/installer
          if-no-files-found: error
          retention-days: 30
